<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مطعمي الشعبي</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#f5e6c8;
    color:#33251b;
    overflow-x:hidden;
}

header{
    background:#7b2d26;
    color:white;
    padding:12px;
    text-align:center;
    box-shadow:0 3px 8px #0004;
}

header h1{
    font-size:25px;
    margin-bottom:8px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.stat{
    background:#ffffff22;
    padding:7px 12px;
    border-radius:20px;
    font-weight:bold;
}

.game{
    max-width:1100px;
    margin:auto;
    padding:15px;
}

/* الزباين */

.customers{
    display:flex;
    gap:14px;
    min-height:220px;
    align-items:flex-end;
    justify-content:center;
    flex-wrap:wrap;
}

.customer{
    width:145px;
    background:white;
    border-radius:15px;
    padding:10px;
    box-shadow:0 4px 10px #0002;
    position:relative;
    animation:appear .35s ease;
}

@keyframes appear{
    from{transform:translateY(30px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

.person{
    width:65px;
    height:95px;
    margin:auto;
    position:relative;
}

.head{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#c98755;
    margin:auto;
    position:relative;
    z-index:2;
    border:2px solid #70452c;
}

.hair{
    width:49px;
    height:20px;
    background:#3b2417;
    border-radius:30px 30px 5px 5px;
    position:absolute;
    top:-2px;
    left:-1px;
}

.eye{
    width:5px;
    height:5px;
    background:#222;
    border-radius:50%;
    position:absolute;
    top:23px;
}

.eye.one{right:10px}
.eye.two{left:10px}

.mouth{
    width:16px;
    height:6px;
    border-bottom:2px solid #522;
    border-radius:50%;
    position:absolute;
    top:33px;
    left:14px;
}

.body{
    width:60px;
    height:52px;
    background:#2878a8;
    position:absolute;
    bottom:0;
    left:2px;
    border-radius:18px 18px 5px 5px;
}

.arm{
    width:12px;
    height:45px;
    background:#c98755;
    position:absolute;
    top:43px;
    border-radius:10px;
}

.arm.left{left:-5px;transform:rotate(15deg)}
.arm.right{right:-5px;transform:rotate(-15deg)}

.order{
    background:#fff3cd;
    border:2px dashed #d99a20;
    border-radius:10px;
    padding:7px;
    text-align:center;
    margin-top:6px;
    font-size:14px;
}

.wait{
    height:7px;
    background:#ddd;
    border-radius:10px;
    margin-top:7px;
    overflow:hidden;
}

.waitbar{
    height:100%;
    background:#43a047;
    width:100%;
    transition:width .5s linear;
}

/* المطبخ */

.kitchen{
    margin-top:20px;
    background:#fffaf0;
    border:3px solid #b47a42;
    border-radius:18px;
    padding:15px;
    box-shadow:0 4px 10px #0002;
}

.kitchen h2{
    text-align:center;
    margin-bottom:12px;
}

.foods{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
}

.food{
    background:white;
    border:2px solid #ddd;
    border-radius:15px;
    padding:12px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
    user-select:none;
}

.food:hover{
    transform:translateY(-4px);
    box-shadow:0 5px 10px #0002;
}

.food:active{
    transform:scale(.95);
}

.foodIcon{
    font-size:42px;
    height:50px;
}

.foodName{
    font-weight:bold;
    margin:5px 0;
}

.foodPrice{
    color:#16833b;
    font-weight:bold;
}

.serving{
    margin-top:15px;
    text-align:center;
    background:#f0dfbd;
    padding:10px;
    border-radius:12px;
    font-weight:bold;
}

/* التحكم */

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:12px;
    padding:11px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.newCustomer{
    background:#2878a8;
    color:white;
}

.upgrade{
    background:#e69a19;
    color:white;
}

.reset{
    background:#8b3a3a;
    color:white;
}

/* رسائل */

#message{
    position:fixed;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:12px 22px;
    border-radius:30px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:20;
}

#message.show{
    opacity:1;
}

.levelBox{
    text-align:center;
    margin:10px;
    font-size:18px;
}

.empty{
    text-align:center;
    color:#765;
    width:100%;
    padding:30px;
}

@media(max-width:600px){
    .customer{
        width:130px;
    }

    .customers{
        min-height:180px;
    }

    header h1{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍽️ مطعمي الشعبي</h1>

    <div class="stats">
        <div class="stat">💰 <span id="money">100</span> جنيه</div>
        <div class="stat">⭐ <span id="rating">100</span>%</div>
        <div class="stat">👥 <span id="served">0</span> زبون</div>
    </div>
</header>

<div id="message"></div>

<div class="game">

    <div class="levelBox">
        المستوى: <b id="level">1</b>
        — الهدف: <b id="goal">5</b> زباين
    </div>

    <section class="customers" id="customers"></section>

    <section class="kitchen">
        <h2>👨‍🍳 المطبخ</h2>

        <div class="foods">

            <div class="food" onclick="prepareFood('foul')">
                <div class="foodIcon">🥣</div>
                <div class="foodName">فول</div>
                <div class="foodPrice">15 جنيه</div>
            </div>

            <div class="food" onclick="prepareFood('falafel')">
                <div class="foodIcon">🧆</div>
                <div class="foodName">فلافل</div>
                <div class="foodPrice">12 جنيه</div>
            </div>

            <div class="food" onclick="prepareFood('baba')">
                <div class="foodIcon">🍆</div>
                <div class="foodName">بابا غنوج</div>
                <div class="foodPrice">20 جنيه</div>
            </div>

            <div class="food" onclick="prepareFood('tahini')">
                <div class="foodIcon">🥄</div>
                <div class="foodName">طحينة</div>
                <div class="foodPrice">10 جنيه</div>
            </div>

            <div class="food" onclick="prepareFood('egg')">
                <div class="foodIcon">🍳</div>
                <div class="foodName">بيض</div>
                <div class="foodPrice">18 جنيه</div>
            </div>

            <div class="food" onclick="prepareFood('potato')">
                <div class="foodIcon">🍟</div>
                <div class="foodName">بطاطس</div>
                <div class="foodPrice">15 جنيه</div>
            </div>

        </div>

        <div class="serving" id="serving">
            اضغط على الأكلة المطلوبة لتحضيرها 👆
        </div>
    </section>

    <div class="controls">
        <button class="newCustomer" onclick="addCustomer()">
            👤 زبون جديد
        </button>

        <button class="upgrade" onclick="upgradeRestaurant()">
            🛠️ تطوير المطعم
        </button>

        <button class="reset" onclick="resetGame()">
            🔄 إعادة اللعبة
        </button>
    </div>

</div>

<script>

/* =========================
   بيانات اللعبة
========================= */

const foods = {
    foul: {
        name:"فول",
        price:15
    },

    falafel:{
        name:"فلافل",
        price:12
    },

    baba:{
        name:"بابا غنوج",
        price:20
    },

    tahini:{
        name:"طحينة",
        price:10
    },

    egg:{
        name:"بيض",
        price:18
    },

    potato:{
        name:"بطاطس",
        price:15
    }
};

let customers = [];
let money = 100;
let rating = 100;
let served = 0;
let level = 1;
let capacity = 3;

let customerId = 1;


/* =========================
   أسماء الزباين
========================= */

const names = [
    "أحمد",
    "محمد",
    "عمر",
    "يوسف",
    "علي",
    "محمود",
    "كريم",
    "سيف",
    "آدم",
    "حسن",
    "مصطفى",
    "ياسين"
];


/* =========================
   رسالة
========================= */

function showMessage(text){

    const msg = document.getElementById("message");

    msg.innerText = text;
    msg.classList.add("show");

    setTimeout(()=>{
        msg.classList.remove("show");
    },1800);
}


/* =========================
   إضافة زبون
========================= */

function addCustomer(){

    if(customers.length >= capacity){

        showMessage("المطعم مليان! 😅");
        return;
    }

    const keys = Object.keys(foods);

    const randomFood =
        keys[Math.floor(Math.random()*keys.length)];

    const customer = {

        id:customerId++,

        name:
            names[Math.floor(Math.random()*names.length)],

        order:randomFood,

        wait:100,

        maxWait:100
    };

    customers.push(customer);

    renderCustomers();

    showMessage("زبون جديد دخل المطعم 👋");
}


/* =========================
   عرض الزباين
========================= */

function renderCustomers(){

    const container =
        document.getElementById("customers");

    container.innerHTML = "";

    if(customers.length === 0){

        container.innerHTML =
            `<div class="empty">
                مفيش زباين دلوقتي 😴<br>
                اضغط "زبون جديد" عشان تبدأ
            </div>`;

        return;
    }

    customers.forEach(customer=>{

        const food =
            foods[customer.order];

        const div =
            document.createElement("div");

        div.className = "customer";

        div.innerHTML = `

            <div class="person">

                <div class="head">

                    <div class="hair"></div>

                    <div class="eye one"></div>
                    <div class="eye two"></div>

                    <div class="mouth"></div>

                </div>

                <div class="body"></div>

                <div class="arm left"></div>
                <div class="arm right"></div>

            </div>

            <div style="text-align:center;font-weight:bold">
                ${customer.name}
            </div>

            <div class="order">
                عايز:<br>
                <b>${food.name}</b>
            </div>

            <div class="wait">
                <div
                    class="waitbar"
                    style="width:${customer.wait}%">
                </div>
            </div>

        `;

        container.appendChild(div);
    });
}


/* =========================
   تجهيز الأكل
========================= */

function prepareFood(foodKey){

    if(customers.length === 0){

        showMessage("مفيش زبون يطلب الأكل 😅");
        return;
    }

    const firstCustomer = customers[0];

    const food = foods[foodKey];

    const serving =
        document.getElementById("serving");

    if(firstCustomer.order === foodKey){

        money += food.price;

        served++;

        rating =
            Math.min(100,rating + 1);

        customers.shift();

        serving.innerHTML =
            `✅ قدمت ${food.name} لـ ${firstCustomer.name}`;

        showMessage(
            `طلب صح! +${food.price} جنيه 💰`
        );

        checkLevel();

    }else{

        rating =
            Math.max(0,rating - 5);

        serving.innerHTML =
            `❌ ${firstCustomer.name} مش طالب ${food.name}`;

        showMessage("الطلب غلط 😅");

    }

    updateStats();
    renderCustomers();
}


/* =========================
   الوقت
========================= */

setInterval(()=>{

    let changed = false;

    customers.forEach(customer=>{

        customer.wait -= 2;

        if(customer.wait <= 0){

            customer.wait = 0;

            rating =
                Math.max(0,rating - 10);

            showMessage(
                `${customer.name} مشي من غير ما ياخد طلبه 😢`
            );

            changed = true;
        }

    });

    customers =
        customers.filter(c=>c.wait > 0);

    if(changed){

        updateStats();
        renderCustomers();
    }else{

        renderCustomers();
    }

},1000);


/* =========================
   المستويات
========================= */

function checkLevel(){

    const goal =
        level * 5;

    if(served >= goal){

        level++;

        capacity++;

        showMessage(
            `🎉 وصلت للمستوى ${level}!`
        );

    }

    document.getElementById("level")
        .innerText = level;

    document.getElementById("goal")
        .innerText = level * 5;
}


/* =========================
   تطوير المطعم
========================= */

function upgradeRestaurant(){

    const cost =
        level * 100;

    if(money < cost){

        showMessage(
            `محتاج ${cost} جنيه للتطوير 💰`
        );

        return;
    }

    money -= cost;

    capacity++;

    showMessage(
        `🛠️ المطعم اتطور! السعة بقت ${capacity}`
    );

    updateStats();
}


/* =========================
   تحديث البيانات
========================= */

function updateStats(){

    document.getElementById("money")
        .innerText = money;

    document.getElementById("rating")
        .innerText = rating;

    document.getElementById("served")
        .innerText = served;

    document.getElementById("level")
        .innerText = level;

    document.getElementById("goal")
        .innerText = level * 5;
}


/* =========================
   حفظ اللعبة
========================= */

function saveGame(){

    const data = {

        money,
        rating,
        served,
        level,
        capacity
    };

    localStorage.setItem(
        "myRestaurantGame",
        JSON.stringify(data)
    );
}


/* =========================
   تحميل اللعبة
========================= */

function loadGame(){

    const saved =
        localStorage.getItem("myRestaurantGame");

    if(!saved) return;

    const data =
        JSON.parse(saved);

    money = data.money ?? 100;
    rating = data.rating ?? 100;
    served = data.served ?? 0;
    level = data.level ?? 1;
    capacity = data.capacity ?? 3;

    updateStats();
}


/* =========================
   حفظ تلقائي
========================= */

setInterval(saveGame,3000);


/* =========================
   إعادة اللعبة
========================= */

function resetGame(){

    const answer =
        confirm("متأكد إنك عايز تبدأ اللعبة من الأول؟");

    if(!answer) return;

    localStorage.removeItem(
        "myRestaurantGame"
    );

    customers = [];

    money = 100;
    rating = 100;
    served = 0;
    level = 1;
    capacity = 3;

    updateStats();
    renderCustomers();

    showMessage("بدأنا لعبة جديدة 🎮");
}


/* =========================
   بداية اللعبة
========================= */

loadGame();
renderCustomers();

</script>

</body>
                    </html>
