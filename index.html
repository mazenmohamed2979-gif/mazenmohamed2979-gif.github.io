<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مطعمي الشعبي</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Tahoma,sans-serif;
  background:#f3dfb8;
}

button{
  font-family:inherit;
  cursor:pointer;
}

body{
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

header{
  height:52px;
  min-height:52px;
  background:#873f12;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:4px;
  padding:4px;
  box-shadow:0 2px 8px #0005;
}

header h1{
  margin:0;
  font-size:18px;
}

.stat{
  background:#ffffff20;
  border-radius:9px;
  padding:4px 8px;
  text-align:center;
  font-size:10px;
}

.stat b{
  display:block;
  font-size:13px;
}

/* ================= GAME ================= */

.game{
  height:calc(100dvh - 52px);
  padding:5px;
  display:flex;
  flex-direction:column;
  gap:5px;
  min-height:0;
}

/* ================= CUSTOMERS ================= */

.customers{
  height:23%;
  min-height:115px;
  display:flex;
  gap:5px;
  overflow:hidden;
  justify-content:center;
}

.customer{
  flex:1;
  max-width:155px;
  min-width:0;
  background:white;
  border:2px solid #c58b43;
  border-radius:12px;
  padding:4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 5px #0002;
  animation:arrive .3s ease;
}

@keyframes arrive{
  from{
    transform:translateY(-30px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.customer.leaving{
  animation:leave .35s forwards;
}

@keyframes leave{
  to{
    transform:translateY(-100%);
    opacity:0;
  }
}

.person{
  width:38px;
  height:45px;
  position:relative;
}

.head{
  width:24px;
  height:24px;
  background:#c8895b;
  border-radius:50%;
  position:absolute;
  left:7px;
  top:0;
}

.body{
  width:38px;
  height:23px;
  background:#2871a9;
  border-radius:18px 18px 5px 5px;
  position:absolute;
  bottom:0;
}

.order{
  width:100%;
  min-height:30px;
  text-align:center;
  color:#512d15;
  font-size:11px;
  font-weight:bold;
  line-height:15px;
}

.order .red{
  color:#c0392b;
  font-size:13px;
}

.progress{
  width:92%;
  height:6px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
}

.progress div{
  height:100%;
  background:#27ae60;
  width:0%;
  transition:.2s;
}

.deliver{
  width:100%;
  border:0;
  border-radius:7px;
  background:#27ae60;
  color:white;
  font-weight:bold;
  padding:5px;
  font-size:10px;
}

.deliver.ready{
  background:#168a48;
  animation:pulse .7s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.03)}
}

/* ================= KITCHEN ================= */

.kitchen{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.sections{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.section{
  background:#fff8ea;
  border:2px solid #b87932;
  border-radius:11px;
  padding:4px;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.section h2{
  margin:0 0 3px;
  padding:4px;
  background:#873f12;
  color:white;
  text-align:center;
  border-radius:7px;
  font-size:14px;
  flex-shrink:0;
}

.food-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:1fr;
  gap:3px;
}

.food{
  border:1px solid #c79855;
  border-radius:7px;
  background:white;
  color:#4d2c16;
  padding:2px;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:bold;
  position:relative;
}

.food:active{
  transform:scale(.93);
}

.food.disabled{
  opacity:.45;
}

.icon{
  font-size:27px;
  line-height:28px;
}

.price{
  color:#d35400;
  font-size:8px;
  text-align:center;
}

/* ================= LADLE ================= */

.ladleBox{
  position:absolute;
  top:1px;
  right:3px;
  width:24px;
  height:36px;
}

.ladleHandle{
  position:absolute;
  width:5px;
  height:23px;
  background:#777;
  top:0;
  left:10px;
  border-radius:5px;
}

.ladleHead{
  position:absolute;
  width:20px;
  height:13px;
  background:#777;
  bottom:0;
  left:2px;
  border-radius:50%;
}

/* ================= BAG ================= */

.bag{
  width:40px;
  height:31px;
  background:#d99a47;
  clip-path:polygon(10% 0,90% 0,78% 100%,22% 100%);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.bag span{
  color:white;
  font-weight:bold;
  font-size:12px;
  margin-bottom:4px;
}

/* ================= BOTTOM ================= */

.bottom{
  height:25%;
  min-height:105px;
  background:#fff8ea;
  border:2px solid #b87932;
  border-radius:11px;
  padding:4px;
  display:flex;
  gap:5px;
}

.tools{
  width:58%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px;
}

.tool{
  background:white;
  border:1px solid #c79855;
  border-radius:7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:bold;
}

.tool .icon{
  font-size:23px;
  line-height:24px;
}

.upgrades{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.upgrades h3{
  margin:0;
  padding:3px;
  border-radius:6px;
  background:#873f12;
  color:white;
  text-align:center;
  font-size:11px;
}

.upgrade{
  flex:1;
  border:0;
  border-radius:7px;
  background:#e67e22;
  color:white;
  font-weight:bold;
  font-size:8px;
}

/* ================= EFFECTS ================= */

.effect{
  position:fixed;
  pointer-events:none;
  z-index:100;
  font-size:32px;
  animation:effect .55s ease-out forwards;
}

@keyframes effect{
  0%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  100%{
    opacity:0;
    transform:translateY(-70px) scale(1.2);
  }
}

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#222e;
  color:white;
  padding:9px 16px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
  animation:toast .9s forwards;
}

@keyframes toast{
  0%{opacity:0}
  15%{opacity:1}
  80%{opacity:1}
  100%{opacity:0}
}

/* ================= SMALL SCREEN ================= */

@media(max-height:650px){

  header{
    height:45px;
    min-height:45px;
  }

  .game{
    height:calc(100dvh - 45px);
  }

  .customers{
    min-height:100px;
  }

  .person{
    transform:scale(.8);
    transform-origin:center top;
    height:38px;
  }

  .icon{
    font-size:23px;
    line-height:24px;
  }

  .tool .icon{
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>

  <h1>🍽️ مطعمي الشعبي</h1>

  <div class="stat">
    💰
    <b id="money">50</b>
  </div>

  <div class="stat">
    ⭐
    <b id="rating">5</b>
  </div>

  <div class="stat">
    👥
    <b id="served">0</b>
  </div>

  <div class="stat">
    🏆
    <b id="level">1</b>
  </div>

</header>

<div class="game">

  <!-- ================= CUSTOMERS ================= -->

  <div class="customers" id="customers"></div>

  <!-- ================= KITCHEN ================= -->

  <div class="kitchen">

    <div class="sections">

      <!-- ================= BULK ================= -->

      <div class="section">

        <h2>🥣 سايب</h2>

        <div class="food-grid">

          <!-- فول -->
          <button class="food" onclick="clickFood('bulk','foul')">

            <div class="ladleBox">
              <div class="ladleHandle"></div>
              <div class="ladleHead"></div>
            </div>

            <div class="icon">🫘</div>
            فول
            <div class="price">مغرفة</div>

          </button>

          <!-- فلافل -->
          <button class="food" onclick="clickBag()">

            <div class="bag">
              <span id="bagCount">0</span>
            </div>

            قرطاس فلافل
            <div class="price">اضغط للإضافة</div>

          </button>

          <button class="food" onclick="clickFood('bulk','baba')">
            <div class="icon">🥣</div>
            بابا غنوج
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','tahina')">
            <div class="icon">🥣</div>
            طحينة
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','foulMix')">
            <div class="icon">🫘</div>
            فول خلطة
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','mesaka')">
            <div class="icon">🍆</div>
            مسقعة
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','eggplant')">
            <div class="icon">🍆</div>
            باذنجان
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','egg')">
            <div class="icon">🥚</div>
            بيض
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','potato')">
            <div class="icon">🍟</div>
            بطاطس
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','fino')">
            <div class="icon">🥖</div>
            عيش فينو
            <div class="price">سايب</div>
          </button>

          <button class="food" onclick="clickFood('bulk','shamy')">
            <div class="icon">🫓</div>
            عيش شامي
            <div class="price">سايب</div>
          </button>

        </div>

      </div>

      <!-- ================= SANDWICHES ================= -->

      <div class="section">

        <h2>🥙 سندوتشات</h2>

        <div class="food-grid">

          <button class="food" onclick="clickFood('sandwich','foul')">
            <div class="icon">🫘</div>
            فول
          </button>

          <button class="food" onclick="clickFood('sandwich','falafel')">
            <div class="icon">🧆</div>
            فلافل
          </button>

          <button class="food" onclick="clickFood('sandwich','foulMix')">
            <div class="icon">🫘</div>
            فول خلطة
          </button>

          <button class="food" onclick="clickFood('sandwich','mesaka')">
            <div class="icon">🍆</div>
            مسقعة
          </button>

          <button class="food" onclick="clickFood('sandwich','eggplant')">
            <div class="icon">🍆</div>
            باذنجان
          </button>

          <button class="food" onclick="clickFood('sandwich','egg')">
            <div class="icon">🥚</div>
            بيض
          </button>

          <button class="food" onclick="clickFood('sandwich','potato')">
            <div class="icon">🍟</div>
            بطاطس
          </button>

        </div>

      </div>

    </div>

    <!-- ================= BOTTOM ================= -->

    <div class="bottom">

      <div class="tools">

        <div class="tool">
          <div class="icon">🥄</div>
          مغرفة
        </div>

        <div class="tool">
          <div class="icon">🫓</div>
          عيش
        </div>

        <div class="tool">
          <div class="icon">🧆</div>
          فلافل
        </div>

        <div class="tool">
          <div class="icon">🥣</div>
          طحينة
        </div>

        <div class="tool">
          <div class="icon">🍆</div>
          مسقعة
        </div>

        <div class="tool">
          <div class="icon">🥚</div>
          بيض
        </div>

      </div>

      <div class="upgrades">

        <h3>⚙️ التطويرات</h3>

        <button class="upgrade" onclick="upgrade('capacity')">
          🥘 المخزون
          <br>
          <span id="capacityCost">30</span> ج
        </button>

        <button class="upgrade" onclick="upgrade('speed')">
          ⚡ السرعة
          <br>
          <span id="speedCost">40</span> ج
        </button>

        <button class="upgrade" onclick="upgrade('service')">
          👨‍🍳 الخدمة
          <br>
          <span id="serviceCost">50</span> ج
        </button>

      </div>

    </div>

  </div>
</div>

<script>

/* =====================================================
   بيانات اللعبة
===================================================== */

const foodNames={

  foul:"فول",
  falafel:"فلافل",
  baba:"بابا غنوج",
  tahina:"طحينة",
  foulMix:"فول خلطة",
  mesaka:"مسقعة",
  eggplant:"باذنجان",
  egg:"بيض",
  potato:"بطاطس",
  fino:"عيش فينو",
  shamy:"عيش شامي"

};


/* =====================================================
   حفظ البيانات
===================================================== */

let money=Number(localStorage.getItem("money")) || 50;
let rating=Number(localStorage.getItem("rating")) || 5;
let served=Number(localStorage.getItem("served")) || 0;
let level=Number(localStorage.getItem("level")) || 1;

let capacityLevel=Number(localStorage.getItem("capacityLevel")) || 1;
let speedLevel=Number(localStorage.getItem("speedLevel")) || 1;
let serviceLevel=Number(localStorage.getItem("serviceLevel")) || 1;


/* =====================================================
   الطلبات
===================================================== */

let customers=[];

let customerId=1;


/*
  كل طلب له:

  type
  food
  required
  prepared

  مثال:

  فول بـ5
  required = 2
  prepared = 0

  كل ضغطة فول:
  prepared++
*/


const bulkFoods=[
  "foul",
  "baba",
  "tahina",
  "foulMix",
  "mesaka",
  "eggplant",
  "egg",
  "potato",
  "fino",
  "shamy"
];


const sandwichFoods=[
  "foul",
  "falafel",
  "foulMix",
  "mesaka",
  "eggplant",
  "egg",
  "potato"
];


/* =====================================================
   تحديث الشاشة
===================================================== */

function updateStats(){

  document.getElementById("money").textContent=money;

  document.getElementById("rating").textContent=rating;

  document.getElementById("served").textContent=served;

  document.getElementById("level").textContent=level;

  document.getElementById("capacityCost").textContent=
    30*capacityLevel;

  document.getElementById("speedCost").textContent=
    40*speedLevel;

  document.getElementById("serviceCost").textContent=
    50*serviceLevel;

}


/* =====================================================
   حفظ
===================================================== */

function save(){

  localStorage.setItem("money",money);
  localStorage.setItem("rating",rating);
  localStorage.setItem("served",served);
  localStorage.setItem("level",level);

  localStorage.setItem("capacityLevel",capacityLevel);
  localStorage.setItem("speedLevel",speedLevel);
  localStorage.setItem("serviceLevel",serviceLevel);

}


/* =====================================================
   إنشاء زبون
===================================================== */

function createCustomer(){

  /*
    لا نزود عن 3 زباين
  */

  if(customers.length>=3) return;


  const bulk=Math.random()<0.5;


  if(bulk){

    const food=
      bulkFoods[
        Math.floor(Math.random()*bulkFoods.length)
      ];


    let moneyAmount=
      (Math.floor(Math.random()*3)+1)*5;


    /*
      كل 5 جنيه = وحدة

      الفول:
      5 = 2 مغرفة
      10 = 4
      15 = 6

      باقي الأصناف:
      5 = وحدة
      10 = وحدتين
      15 = 3
    */

    let required;

    if(food==="foul"){

      required=
        (moneyAmount/5)*2;

    }else{

      required=
        moneyAmount/5;

    }


    customers.push({

      id:customerId++,

      type:"bulk",

      food:food,

      money:moneyAmount,

      required:required,

      prepared:0

    });

  }else{

    const food=
      sandwichFoods[
        Math.floor(Math.random()*sandwichFoods.length)
      ];


    const required=
      Math.floor(Math.random()*3)+1;


    customers.push({

      id:customerId++,

      type:"sandwich",

      food:food,

      money:required*5,

      required:required,

      prepared:0

    });

  }


  renderCustomers();

}


/* =====================================================
   عرض الزباين
===================================================== */

function renderCustomers(){

  const box=document.getElementById("customers");

  box.innerHTML="";


  customers.forEach(c=>{

    const div=document.createElement("div");

    div.className="customer";

    div.id="customer-"+c.id;


    let text="";


    if(c.type==="bulk"){

      if(c.food==="foul"){

        text=
          `عايز بـ<span class="red">${c.money}</span> فول<br>`+
          `🥄 ${c.required} مغارف`;

      }
      else if(c.food==="falafel"){

        text=
          `عايز بـ<span class="red">${c.money}</span> فلافل<br>`+
          `🧆 ${c.required} فلافلية`;

      }
      else{

        text=
          `عايز بـ<span class="red">${c.money}</span> `+
          foodNames[c.food];

      }

    }else{

      text=
        `عايز <span class="red">${c.required}</span> سندوتش<br>`+
        foodNames[c.food];

    }


    const percentage=
      Math.min(
        100,
        (c.prepared/c.required)*100
      );


    const ready=
      c.prepared>=c.required;


    div.innerHTML=`

      <div class="person">
        <div class="head"></div>
        <div class="body"></div>
      </div>

      <div class="order">
        ${text}
      </div>

      <div class="progress">
        <div style="width:${percentage}%"></div>
      </div>

      <button
        class="deliver ${ready?"ready":""}"
        onclick="deliver(${c.id})"
      >
        ${ready?"✅ تسليم":"تسليم الطلب"}
      </button>

    `;


    box.appendChild(div);

  });

}


/* =====================================================
   البحث عن الطلب المناسب
===================================================== */

function findOrder(type,food){

  /*
    ندور على أول طلب من نفس النوع
    ونفس الصنف ولسه ناقص
  */

  return customers.find(c=>

    c.type===type &&
    c.food===food &&
    c.prepared<c.required

  );

}


/* =====================================================
   ضغط أي مكون
===================================================== */

function clickFood(type,food){

  const order=findOrder(type,food);


  /*
    لو مفيش طلب مطابق
  */

  if(!order){

    toast("مفيش زبون طالب الصنف ده دلوقتي ❌");

    return;
  }


  /*
    الفول السايب
    كل ضغطة = مغرفة
  */

  if(type==="bulk" && food==="foul"){

    order.prepared++;

    effect("🥄");

    toast(
      `مغرفة فول ${order.prepared}/${order.required}`
    );

  }


  /*
    باقي السايب
    كل ضغطة = وحدة
  */

  else if(type==="bulk"){

    order.prepared++;

    effect("🥣");

    toast(
      `${order.prepared}/${order.required}`
    );

  }


  /*
    الساندوتش
    كل ضغطة = سندوتش
  */

  else{

    order.prepared++;

    effect("🥙");

    toast(
      `سندوتش ${order.prepared}/${order.required}`
    );

  }


  renderCustomers();

}


/* =====================================================
   قرطاس الفلافل
===================================================== */

let bagOrderId=null;
let bagCount=0;


function clickBag(){

  /*
    لازم يكون فيه طلب فلافل سايب
  */

  const order=findOrder("bulk","falafel");


  if(!order){

    toast("مفيش طلب فلافل سايب دلوقتي ❌");

    return;
  }


  /*
    لو بدأنا طلب جديد
  */

  if(bagOrderId!==order.id){

    bagOrderId=order.id;

    bagCount=order.prepared;

  }


  /*
    القرطاس اكتمل
  */

  if(order.prepared>=order.required){

    toast("القرطاس اكتمل ✅");

    return;
  }


  /*
    إضافة فلافلية واحدة
  */

  order.prepared++;

  bagCount=order.prepared;


  document.getElementById("bagCount").textContent=
    bagCount;


  effect("🧆");


  toast(
    `${bagCount}/${order.required} فلافلية`
  );


  renderCustomers();

}


/* =====================================================
   تسليم الطلب
===================================================== */

function deliver(id){

  const order=
    customers.find(c=>c.id===id);


  if(!order) return;


  /*
    الطلب ناقص
  */

  if(order.prepared<order.required){

    const left=
      order.required-order.prepared;

    toast(
      `الطلب ناقص ${left} ❌`
    );

    return;

  }


  /*
    فلوس
  */

  money+=order.money;

  served++;


  /*
    كل 10 زباين = لفل
  */

  if(served%10===0){

    level++;

    toast("🎉 مستوى جديد!");

  }else{

    toast("✅ الطلب اتسلّم");

  }


  /*
    حركة الزبون
  */

  const element=
    document.getElementById(
      "customer-"+id
    );


  if(element){

    element.classList.add("leaving");

  }


  /*
    حذف الطلب
  */

  setTimeout(()=>{

    customers=
      customers.filter(
        c=>c.id!==id
      );

    renderCustomers();

  },350);


  /*
    إعادة القرطاس
  */

  if(bagOrderId===id){

    bagOrderId=null;

    bagCount=0;

    document.getElementById(
      "bagCount"
    ).textContent="0";

  }


  save();

  updateStats();

}


/* =====================================================
   المؤثر
===================================================== */

function effect(symbol){

  const e=
    document.createElement("div");

  e.className="effect";

  e.textContent=symbol;

  e.style.left=
    (40+Math.random()*20)+"%";

  e.style.top="58%";


  document.body.appendChild(e);


  setTimeout(()=>{
    e.remove();
  },600);

}


/* =====================================================
   رسالة
===================================================== */

function toast(text){

  const old=
    document.querySelector(".toast");

  if(old) old.remove();


  const t=
    document.createElement("div");

  t.className="toast";

  t.textContent=text;


  document.body.appendChild(t);


  setTimeout(()=>{
    t.remove();
  },900);

}


/* =====================================================
   التطويرات
===================================================== */

function upgrade(type){

  let cost;


  if(type==="capacity"){

    cost=30*capacityLevel;

    if(money<cost){

      toast("الفلوس مش كفاية 💰");

      return;
    }

    money-=cost;

    capacityLevel++;

    toast("🥘 المخزون اتطور!");

  }


  if(type==="speed"){

    cost=40*speedLevel;

    if(money<cost){

      toast("الفلوس مش كفاية 💰");

      return;
    }

    money-=cost;

    speedLevel++;

    toast("⚡ السرعة اتطورت!");

  }


  if(type==="service"){

    cost=50*serviceLevel;

    if(money<cost){

      toast("الفلوس مش كفاية 💰");

      return;
    }

    money-=cost;

    serviceLevel++;

    toast("👨‍🍳 الخدمة اتطورت!");

  }


  save();

  updateStats();

}


/* =====================================================
   البداية
===================================================== */

updateStats();

  أول 3 زباين
*/

setTimeout(createCustomer,900);

  زبون جديد تلقائيًا
*/

setInterval(()=>{

  createCustomer();

},3500);


/*
  حفظ تلقائي
*/

setInterval(save,5000);

</script>
