<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مطعم فول وفلافل - MAZEN MOHAMED</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1e272e, #d35400);
            color: #fff;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin: 8px 0;
            font-size: 26px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            color: #f1c40f;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto 10px auto;
            border: 2px solid #f39c12;
        }

        /* شاشة المطعم والزبون الكرتوني بتصميم مميز */
        .kitchen-scene {
            position: relative;
            background: #2c3e50;
            border: 4px solid #f1c40f;
            border-radius: 15px;
            height: 140px;
            max-width: 650px;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        .customer-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .avatar {
            font-size: 45px;
        }

        .order-bubble {
            background: #fff;
            color: #2c3e50;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            position: absolute;
            top: 8px;
            border: 2px solid #c0392b;
            max-width: 85%;
        }

        .timer-bar-container {
            width: 150px;
            height: 8px;
            background: #7f8c8d;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: #2ecc71;
            width: 100%;
            transition: width 0.1s linear;
        }

        /* طاولة التحضير */
        .counter-area {
            background: #f8f9fa;
            color: #333;
            max-width: 650px;
            margin: 0 auto 10px auto;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 3px solid #e67e22;
        }

        .sandwich-plate {
            background: #eaeded;
            border: 2px dashed #95a5a6;
            border-radius: 10px;
            min-height: 45px;
            padding: 6px;
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            align-items: center;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ingredient-btn {
            background: #f39c12;
            color: #fff;
            border: none;
            padding: 8px 4px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }

        .ingredient-btn:active {
            transform: scale(0.93);
        }
        .ingredient-btn:hover {
            background: #d35400;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-main {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        .btn-main:hover { background: #219653; }

        .btn-clear {
            background: #c0392b;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-clear:hover { background: #a93226; }

        #gameMessage {
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
            min-height: 22px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>🥙 مطعم فول وفلافل (شيف مازن) 🥙</h1>
    
    <div class="stats-bar">
        <span>💰 الأرباح: <span id="moneyScore">0</span> ج.م</span>
        <span>⭐ الطلبات الناجحة: <span id="successCount">0</span></span>
    </div>

    <!-- شاشة المطبخ والزبون مع مؤشر الوقت -->
    <div class="kitchen-scene" id="kitchenScene">
        <div id="customerContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <!-- طاولة التحضير والمكونات -->
    <div class="counter-area">
        <div style="font-weight: bold; margin-bottom: 4px; color: #d35400;">🍽️ طاسة الساندوتشات:</div>
        <div class="sandwich-plate" id="sandwichPlate">اختر العيش والمكونات من تحت..</div>

        <div style="font-weight: bold; margin-bottom: 6px; color: #2c3e50;">المكونات المتاحة:</div>
        <div class="ingredients-grid">
            <button class="ingredient-btn" onclick="addIngredient('🥖 فينو')">🥖 فينو</button>
            <button class="ingredient-btn" onclick="addIngredient('🫓 شامي')">🫓 شامي</button>
            <button class="ingredient-btn" onclick="addIngredient('🧆 فلافل')">🧆 فلافل</button>
            <button class="ingredient-btn" onclick="addIngredient('🥣 فول')">🥣 فول</button>
            <button class="ingredient-btn" onclick="addIngredient('🌿 فول بخلطة')">🌿 فول بخلطة</button>
            <button class="ingredient-btn" onclick="addIngredient('🍆 بابا غنوج')">🍆 بابا غنوج</button>
            <button class="ingredient-btn" onclick="addIngredient('🍆 باذنجان')">🍆 باذنجان</button>
            <button class="ingredient-btn" onclick="addIngredient('🥘 مسقعة')">🥘 مسقعة</button>
            <button class="ingredient-btn" onclick="addIngredient('🥒 مخلل')">🥒 مخلل</button>
            <button class="ingredient-btn" onclick="addIngredient('🤍 طحينة')">🤍 طحينة</button>
            <button class="ingredient-btn" onclick="addIngredient('🌿 شبت وبقدونس')">🌿 بقدونس</button>
        </div>

        <div class="action-buttons">
            <button class="btn-main" onclick="serveOrder()">🚀 تسليم الساندوتش</button>
            <button class="btn-clear" onclick="clearPlate()">🗑️ مسح الطاسة</button>
        </div>
    </div>

    <div id="gameMessage">جاهز يا شيف؟ ابدأ الشغل!</div>

    <script>
        // نظام توليد الأصوات الداخلية (Web Audio API) بدون ملفات خارجية
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const availableItems = [
            '🥖 فينو', '🫓 شامي', 
            '🧆 فلافل', '🥣 فول', '🌿 فول بخلطة', 
            '🍆 بابا غنوج', '🍆 باذنجان', '🥘 مسقعة', 
            '🥒 مخلل', '🤍 طحينة', '🌿 بقدونس'
        ];

        const avatars = ['🤵', '👷‍♂️', '🧕', '👨‍🦱', '🧔‍♂️', '🧑‍🎓', '👳‍♂️'];

        let currentMoney = 0;
        let successOrders = 0;
        let currentCustomerOrder = [];
        let currentSandwich = [];
        let currentAvatar = '🤵';
        let timeLeft = 100;
        let timerInterval = null;

        function spawnCustomer() {
            clearInterval(timerInterval);
            currentSandwich = [];
            updatePlateDisplay();
            
            currentAvatar = avatars[Math.floor(Math.random() * avatars.length)];
            
            let orderSize = Math.floor(Math.random() * 3) + 2;
            currentCustomerOrder = [];
            
            let bread = Math.random() > 0.5 ? '🥖 فينو' : '🫓 شامي';
            currentCustomerOrder.push(bread);

            while(currentCustomerOrder.length < orderSize) {
                let randomIng = availableItems[Math.floor(Math.random() * availableItems.length)];
                if(!currentCustomerOrder.includes(randomIng)) {
                    currentCustomerOrder.push(randomIng);
                }
            }

            const customerContainer = document.getElementById('customerContainer');
            customerContainer.innerHTML = `
                <div class="customer-box">
                    <div class="order-bubble">طلب الزبون: ${currentCustomerOrder.join(' + ')}</div>
                    <div class="avatar">${currentAvatar}</div>
                    <div class="timer-bar-container">
                        <div class="timer-fill" id="timerFill"></div>
                    </div>
                </div>
            `;
            
            document.getElementById('gameMessage').textContent = "الزبون مستني الطلب.. اخلص يا شيف!";
            document.getElementById('gameMessage').style.color = "#f1c40f";

            // تشغيل مؤتمر الوقت للزبون (12 ثانية لكل زبون)
            timeLeft = 100;
            let totalTime = 12000; // 12 ثانية
            let intervalTime = 100;
            let decrement = 100 / (totalTime / intervalTime);

            timerInterval = setInterval(() => {
                timeLeft -= decrement;
                let fill = document.getElementById('timerFill');
                if(fill) {
                    fill.style.width = timeLeft + '%';
                    if(timeLeft < 40) fill.style.background = '#e74c3c';
                    else fill.style.background = '#2ecc71';
                }

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound('fail');
                    document.getElementById('gameMessage').textContent = "⏳ الوقت خلص! الزبون زهق ومشي زعلان.";
                    document.getElementById('gameMessage').style.color = "#e74c3c";
                    setTimeout(spawnCustomer, 1500);
                }
            }, intervalTime);
        }

        function addIngredient(item) {
            playSound('click');
            currentSandwich.push(item);
            updatePlateDisplay();
        }

        function clearPlate() {
            playSound('click');
            currentSandwich = [];
            updatePlateDisplay();
        }

        function updatePlateDisplay() {
            const plate = document.getElementById('sandwichPlate');
            if(currentSandwich.length === 0) {
                plate.textContent = "اختر العيش والمكونات من تحت..";
            } else {
                plate.textContent = currentSandwich.join(' ➔ ');
            }
        }

        function serveOrder() {
            if(currentSandwich.length === 0) {
                playSound('fail');
                document.getElementById('gameMessage').textContent = "⚠️ الطاسة فاضية يا شيف!";
                document.getElementById('gameMessage').style.color = "#e74c3c";
                return;
            }

            clearInterval(timerInterval);

            let isMatch = true;
            if(currentSandwich.length !== currentCustomerOrder.length) {
                isMatch = false;
            } else {
                for(let item of currentCustomerOrder) {
                    if(!currentSandwich.includes(item)) {
                        isMatch = false;
                        break;
                    }
                }
            }

            const msg = document.getElementById('gameMessage');
            if(isMatch) {
                playSound('success');
                currentMoney += 20;
                successOrders++;
                document.getElementById('moneyScore').textContent = currentMoney;
                document.getElementById('successCount').textContent = successOrders;
                msg.textContent = "🎉 تسلم إيدك يا شيف مازن! أكل تمام وقبضنا الحساب.";
                msg.style.color = "#2ecc71";
                
                setTimeout(spawnCustomer, 1200);
            } else {
                playSound('fail');
                msg.textContent = "❌ الطلب غلط! الزبون ساب المطعم ومشي.";
                msg.style.color = "#e74c3c";
                setTimeout(spawnCustomer, 1500);
            }
        }

        window.onload = function() {
            spawnCustomer();
        };
    </script>
</body>
    </html>
