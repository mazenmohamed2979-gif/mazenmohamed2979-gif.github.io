<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مطعم فول وفلافل - MAZEN MOHAMED</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #111827, #b45309);
            color: #fff;
            margin: 0;
            padding: 8px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            color: #facc15;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 15px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            border-radius: 10px;
            max-width: 450px;
            margin: 0 auto 8px auto;
            border: 2px solid #f59e0b;
        }

        /* شاشة المطعم وحركة الزبائن */
        .kitchen-scene {
            position: relative;
            background: #1f2937;
            border: 3px solid #facc15;
            border-radius: 12px;
            height: 130px;
            max-width: 600px;
            margin: 0 auto 8px auto;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        .customer {
            position: absolute;
            bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s ease-in-out;
        }

        .avatar {
            font-size: 45px;
        }

        .order-bubble {
            background: #fff;
            color: #111;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 2px solid #ef4444;
            white-space: nowrap;
            margin-bottom: 3px;
        }

        .timer-bar-container {
            width: 120px;
            height: 6px;
            background: #4b5563;
            border-radius: 3px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: #10b981;
            width: 100%;
        }

        /* طاولة المكونات والأطباق البارزة */
        .counter-area {
            background: #f3f4f6;
            color: #111;
            max-width: 600px;
            margin: 0 auto 8px auto;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            border: 3px solid #d97706;
        }

        .sandwich-plate {
            background: #e5e7eb;
            border: 2px dashed #9ca3af;
            border-radius: 8px;
            min-height: 40px;
            padding: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            align-items: center;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .ingredient-dish {
            background: #ffffff;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 6px 2px;
            font-size: 12px;
            font-weight: bold;
            color: #1f2937;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .ingredient-dish span:first-child {
            font-size: 20px;
        }

        .ingredient-dish:active {
            transform: scale(0.92);
        }
        .ingredient-dish:hover {
            background: #fef3c7;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-main {
            background: #059669;
            color: white;
            border: none;
            padding: 6px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-main:hover { background: #047857; }

        .btn-clear {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-clear:hover { background: #b91c1c; }

        #gameMessage {
            font-size: 15px;
            font-weight: bold;
            margin-top: 5px;
            min-height: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>🥙 مطعم فول وفلافل (شيف مازن) 🥙</h1>
    
    <div class="stats-bar">
        <span>💰 الأرباح: <span id="moneyScore">0</span> ج.م</span>
        <span>⭐ الطلبات: <span id="successCount">0</span></span>
    </div>

    <!-- شاشة المطبخ والزبون المتحرك -->
    <div class="kitchen-scene" id="kitchenScene">
        <div id="customerSlot" class="customer" style="right: -100px;">
            <div class="order-bubble" id="orderBubble">مستني الطلب...</div>
            <div class="avatar" id="customerAvatar">🤵</div>
            <div class="timer-bar-container">
                <div class="timer-fill" id="timerFill"></div>
            </div>
        </div>
    </div>

    <!-- أطباق المكونات البارزة وطاسة التحضير -->
    <div class="counter-area">
        <div style="font-weight: bold; margin-bottom: 3px; color: #b45309;">🍽️ طاسة الساندوتشات الحالية:</div>
        <div class="sandwich-plate" id="sandwichPlate">اختر العيش والأطباق من تحت..</div>

        <div style="font-weight: bold; margin-bottom: 5px; color: #1f2937;">أطباق المكونات الطازجة:</div>
        <div class="ingredients-grid">
            <button class="ingredient-dish" onclick="addIngredient('🥖 فينو')"><span>🥖</span><span>فينو</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🫓 شامي')"><span>🫓</span><span>شامي</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🧆 فلافل')"><span>🧆</span><span>فلافل</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🥣 فول')"><span>🥣</span><span>فول</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🌿 خلطة')"><span>🌿</span><span>خلطة</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🥔 بطاطس')"><span>🥔</span><span>بطاطس</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🍆 بابا غنوج')"><span>🍆</span><span>غنوج</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🍆 باذنجان')"><span>🍆</span><span>باذنجان</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🥘 مسقعة')"><span>🥘</span><span>مسقعة</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🥒 مخلل')"><span>🥒</span><span>مخلل</span></button>
            <button class="ingredient-dish" onclick="addIngredient('🤍 طحينة')"><span>🤍</span><span>طحينة</span></button>
        </div>

        <div class="action-buttons">
            <button class="btn-main" onclick="serveOrder()">🚀 تسليم الساندوتش</button>
            <button class="btn-clear" onclick="clearPlate()">🗑️ مسح الطاسة</button>
        </div>
    </div>

    <div id="gameMessage">المطعم فتح والزبائن في الطريق!</div>

    <script>
        // نظام الصوت الداخلي
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.07);
                gainNode.gain.setValueAtTime(0.12, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
                osc.start(now); osc.stop(now + 0.07);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gainNode.gain.setValueAtTime(0.18, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
                gainNode.gain.setValueAtTime(0.18, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        const availableItems = [
            '🥖 فينو', '🫓 شامي', '🧆 فلافل', '🥣 فول', 
            '🌿 خلطة', '🥔 بطاطس', '🍆 بابا غنوج', '🍆 باذنجان', 
            '🥘 مسقعة', '🥒 مخلل', '🤍 طحينة'
        ];

        const avatars = ['🤵', '👷‍♂️', '🧕', '👨‍🦱', '🧔‍♂️', '🧑‍🎓', '👳‍♂️', '👩‍💼'];

        let currentMoney = 0;
        let successOrders = 0;
        let currentCustomerOrder = [];
        let currentSandwich = [];
        let timerInterval = null;
        let isServing = false;

        function startNewCustomer() {
            isServing = false;
            currentSandwich = [];
            updatePlateDisplay();

            let avatar = avatars[Math.floor(Math.random() * avatars.length)];
            document.getElementById('customerAvatar').textContent = avatar;

            let orderSize = Math.floor(Math.random() * 3) + 2;
            currentCustomerOrder = [];
            let bread = Math.random() > 0.5 ? '🥖 فينو' : '🫓 شامي';
            currentCustomerOrder.push(bread);

            while(currentCustomerOrder.length < orderSize) {
                let randomIng = availableItems[Math.floor(Math.random() * availableItems.length)];
                if(!currentCustomerOrder.includes(randomIng)) {
                    currentCustomerOrder.push(randomIng);
                }
            }

            document.getElementById('orderBubble').textContent = "أنا طالب: " + currentCustomerOrder.join(' + ');

            // حركة دخول الزبون من اليمين للمنتصف
            let customerSlot = document.getElementById('customerSlot');
            customerSlot.style.right = '-100px';
            setTimeout(() => {
                customerSlot.style.right = '40%';
            }, 100);

            document.getElementById('gameMessage').textContent = "الزبون وصل الكاونتر.. جهز الطلب!";
            document.getElementById('gameMessage').style.color = "#facc15";

            // مؤشر الوقت (14 ثانية)
            clearInterval(timerInterval);
            let timeLeft = 100;
            let totalTime = 14000;
            let intervalTime = 100;
            let decrement = 100 / (totalTime / intervalTime);

            timerInterval = setInterval(() => {
                timeLeft -= decrement;
                let fill = document.getElementById('timerFill');
                if(fill) {
                    fill.style.width = timeLeft + '%';
                    fill.style.background = timeLeft < 35 ? '#ef4444' : '#10b981';
                }

                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if(!isServing) {
                        isServing = true;
                        playSound('fail');
                        document.getElementById('gameMessage').textContent = "⏳ الوقت خلص! الزبون مشي غضبان.";
                        document.getElementById('gameMessage').style.color = "#ef4444";
                        
                        // حركة خروج الزبون لليسار
                        customerSlot.style.right = '110%';
                        setTimeout(startNewCustomer, 1000);
                    }
                }
            }, intervalTime);
        }

        function addIngredient(item) {
            if(isServing) return;
            playSound('click');
            currentSandwich.push(item);
            updatePlateDisplay();
        }

        function clearPlate() {
            if(isServing) return;
            playSound('click');
            currentSandwich = [];
            updatePlateDisplay();
        }

        function updatePlateDisplay() {
            const plate = document.getElementById('sandwichPlate');
            if(currentSandwich.length === 0) {
                plate.textContent = "اختر العيش والأطباق من تحت..";
            } else {
                plate.textContent = currentSandwich.join(' ➔ ');
            }
        }

        function serveOrder() {
            if(isServing) return;
            if(currentSandwich.length === 0) {
                playSound('fail');
                document.getElementById('gameMessage').textContent = "⚠️ الطاسة فاضية يا شيف!";
                document.getElementById('gameMessage').style.color = "#ef4444";
                return;
            }

            isServing = true;
            clearInterval(timerInterval);

            let isMatch = true;
            if(currentSandwich.length !== currentCustomerOrder.length) {
                isMatch = false;
            } else {
                for(let item of currentCustomerOrder) {
                    if(!currentSandwich.includes(item)) {
                        isMatch = false;
                        break;
                    }
                }
            }

            let customerSlot = document.getElementById('customerSlot');
            const msg = document.getElementById('gameMessage');

            if(isMatch) {
                playSound('success');
                currentMoney += 25;
                successOrders++;
                document.getElementById('moneyScore').textContent = currentMoney;
                document.getElementById('successCount').textContent = successOrders;
                msg.textContent = "🎉 تسلم إيدك يا شيف مازن! الزبون فرح ودفع الحساب.";
                msg.style.color = "#10b981";
                
                // حركة خروج الزبون وهو مبسوط لليسار
                customerSlot.style.right = '110%';
                setTimeout(startNewCustomer, 1000);
            } else {
                playSound('fail');
                msg.textContent = "❌ الطلب مش مظبوط! الزبون زعل وساب المطعم.";
                msg.style.color = "#ef4444";
                
                customerSlot.style.right = '110%';
                setTimeout(startNewCustomer, 1000);
            }
        }

        window.onload = function() {
            startNewCustomer();
        };
    </script>
</body>
    </html>
