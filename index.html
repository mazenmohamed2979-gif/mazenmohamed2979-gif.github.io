<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مطعمي الشعبي</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4dfb5;
}

body{
  display:flex;
  flex-direction:column;
}

header{
  height:54px;
  min-height:54px;
  background:#8b4513;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:4px;
  box-shadow:0 2px 8px #0005;
  z-index:5;
}

header h1{
  margin:0;
  font-size:19px;
}

.stat{
  background:#ffffff22;
  border-radius:10px;
  padding:5px 8px;
  text-align:center;
  font-size:11px;
}

.stat b{
  display:block;
  font-size:14px;
}

.game{
  height:calc(100dvh - 54px);
  padding:5px;
  display:flex;
  flex-direction:column;
  gap:5px;
  min-height:0;
}

/* الزباين */

.customers{
  height:24%;
  min-height:125px;
  display:flex;
  gap:5px;
  overflow:hidden;
  justify-content:center;
}

.customer{
  flex:1;
  max-width:150px;
  min-width:0;
  background:#fff;
  border:2px solid #d3a15b;
  border-radius:13px;
  padding:4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 5px #0002;
  position:relative;
  animation:arrive .35s ease;
}

@keyframes arrive{
  from{transform:translateY(-30px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.customer.done{
  animation:leave .4s forwards;
}

@keyframes leave{
  to{
    transform:translateY(-100%);
    opacity:0;
  }
}

.person{
  width:38px;
  height:48px;
  position:relative;
  margin-top:1px;
}

.head{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#c8895b;
  position:absolute;
  top:0;
  left:7px;
}

.body{
  width:38px;
  height:25px;
  border-radius:18px 18px 5px 5px;
  background:#2768a8;
  position:absolute;
  bottom:0;
}

.order{
  width:100%;
  text-align:center;
  font-weight:bold;
  color:#5a3015;
  font-size:12px;
  line-height:16px;
}

.order .amount{
  color:#c0392b;
  font-size:14px;
}

.customer button{
  width:100%;
  border:0;
  border-radius:8px;
  background:#27ae60;
  color:white;
  font-weight:bold;
  padding:5px 2px;
  font-size:11px;
}

/* المطبخ */

.kitchen{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.sections{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}

.section{
  background:#fff7e8;
  border:2px solid #b87932;
  border-radius:12px;
  padding:4px;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.section h2{
  margin:0 0 3px;
  text-align:center;
  background:#8b4513;
  color:#fff;
  border-radius:8px;
  font-size:15px;
  padding:4px;
  flex-shrink:0;
}

.food-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:1fr;
  gap:3px;
}

.food{
  border:1px solid #c99958;
  border-radius:8px;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:0;
  padding:2px;
  font-size:9px;
  font-weight:bold;
  color:#4d2c16;
  position:relative;
  overflow:hidden;
}

.food:active{
  transform:scale(.94);
}

.icon{
  font-size:29px;
  line-height:30px;
}

.price{
  color:#d35400;
  font-size:9px;
}

/* المغرفة */

.ladle{
  position:absolute;
  top:-2px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:34px;
  z-index:4;
  pointer-events:none;
}

.ladle-handle{
  position:absolute;
  width:5px;
  height:22px;
  background:#777;
  left:7px;
  top:0;
  border-radius:4px;
}

.ladle-head{
  position:absolute;
  width:18px;
  height:13px;
  background:#777;
  border-radius:50%;
  bottom:0;
}

/* قرطاس */

.bag{
  width:39px;
  height:30px;
  background:#d99b48;
  clip-path:polygon(10% 0,90% 0,78% 100%,22% 100%);
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.bag span{
  color:white;
  font-size:11px;
  font-weight:bold;
  margin-bottom:4px;
}

.bulk-active{
  outline:3px solid #27ae60;
}

/* السجل */

.bottom{
  height:29%;
  min-height:125px;
  background:#fff7e8;
  border:2px solid #b87932;
  border-radius:12px;
  padding:4px;
  display:flex;
  gap:5px;
}

.tools{
  width:55%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px;
}

.tool{
  background:#fff;
  border:1px solid #c99958;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:8px;
  font-weight:bold;
  color:#4d2c16;
}

.tool .icon{
  font-size:25px;
  line-height:26px;
}

.upgrades{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.upgrades h3{
  margin:0;
  text-align:center;
  font-size:12px;
  background:#8b4513;
  color:white;
  padding:3px;
  border-radius:7px;
}

.upgrade{
  flex:1;
  border:0;
  border-radius:7px;
  background:#e67e22;
  color:white;
  font-size:9px;
  font-weight:bold;
}

/* مؤثر الغرف */

.scoop{
  position:fixed;
  pointer-events:none;
  font-size:34px;
  z-index:99;
  animation:scoop .55s ease-out forwards;
}

@keyframes scoop{
  0%{
    opacity:1;
    transform:translate(0,0) rotate(0);
  }
  100%{
    opacity:0;
    transform:translate(0,-75px) rotate(25deg);
  }
}

.toast{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#222e;
  color:white;
  padding:10px 18px;
  border-radius:12px;
  font-weight:bold;
  z-index:200;
  animation:toast .9s forwards;
}

@keyframes toast{
  0%{opacity:0;transform:translate(-50%,-30%)}
  15%{opacity:1;transform:translate(-50%,-50%)}
  80%{opacity:1}
  100%{opacity:0}
}

/* شاشات صغيرة جدا */

@media(max-height:650px){
  header{
    height:46px;
    min-height:46px;
  }

  .game{
    height:calc(100dvh - 46px);
  }

  .customers{
    min-height:105px;
  }

  .person{
    transform:scale(.8);
    transform-origin:center top;
    height:40px;
  }

  .icon{
    font-size:24px;
    line-height:25px;
  }

  .food .icon{
    font-size:25px;
  }

  .bottom{
    min-height:105px;
  }

  .tool .icon{
    font-size:21px;
    line-height:22px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🍽️ مطعمي الشعبي</h1>

  <div class="stat">
    💰
    <b id="money">50</b>
  </div>

  <div class="stat">
    ⭐
    <b id="rating">5</b>
  </div>

  <div class="stat">
    👥
    <b id="served">0</b>
  </div>

  <div class="stat">
    🏆
    <b id="level">1</b>
  </div>
</header>

<div class="game">

  <div class="customers" id="customers"></div>

  <div class="kitchen">

    <div class="sections">

      <!-- السايب -->
      <div class="section">
        <h2>🥣 سايب</h2>

        <div class="food-grid">

          <button class="food" onclick="bulkFood('foul')">
            <div class="ladle">
              <div class="ladle-handle"></div>
              <div class="ladle-head"></div>
            </div>
            <div class="icon">🫘</div>
            فول
            <div class="price">5 ج = 2 مغرفة</div>
          </button>

          <button class="food" onclick="bulkFood('falafel')">
            <div class="icon">🧆</div>
            فلافل
            <div class="price">5 ج = 4</div>
          </button>

          <button class="food" onclick="bulkFood('baba')">
            <div class="icon">🥣</div>
            بابا غنوج
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('tahina')">
            <div class="icon">🥣</div>
            طحينة
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('foulMix')">
            <div class="icon">🫘</div>
            فول خلطة
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('mesaka')">
            <div class="icon">🍆</div>
            مسقعة
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('eggplant')">
            <div class="icon">🍆</div>
            باذنجان
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('egg')">
            <div class="icon">🥚</div>
            بيض
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('potato')">
            <div class="icon">🍟</div>
            بطاطس
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('fino')">
            <div class="icon">🥖</div>
            عيش فينو
            <div class="price">5 ج</div>
          </button>

          <button class="food" onclick="bulkFood('shamy')">
            <div class="icon">🫓</div>
            عيش شامي
            <div class="price">5 ج</div>
          </button>

          <!-- القرطاس -->
          <button class="food" id="bagButton" onclick="useBag()">
            <div class="bag">
              <span id="bagCount">0</span>
            </div>
            قرطاس فلافل
            <div class="price">اضغط للإضافة</div>
          </button>

        </div>
      </div>

      <!-- الساندوتشات -->
      <div class="section">
        <h2>🥙 سندوتشات</h2>

        <div class="food-grid">

          <button class="food" onclick="sandwich('foul')">
            <div class="icon">🫘</div>
            فول
          </button>

          <button class="food" onclick="sandwich('falafel')">
            <div class="icon">🧆</div>
            فلافل
          </button>

          <button class="food" onclick="sandwich('foulMix')">
            <div class="icon">🫘</div>
            فول خلطة
          </button>

          <button class="food" onclick="sandwich('mesaka')">
            <div class="icon">🍆</div>
            مسقعة
          </button>

          <button class="food" onclick="sandwich('eggplant')">
            <div class="icon">🍆</div>
            باذنجان
          </button>

          <button class="food" onclick="sandwich('egg')">
            <div class="icon">🥚</div>
            بيض
          </button>

          <button class="food" onclick="sandwich('potato')">
            <div class="icon">🍟</div>
            بطاطس
          </button>

          <!-- الخلطة اتشالت من هنا -->

        </div>
      </div>

    </div>

    <div class="bottom">

      <div class="tools">
        <div class="tool">
          <div class="icon">🥄</div>
          مغرفة
        </div>

        <div class="tool">
          <div class="icon">🫓</div>
          عيش
        </div>

        <div class="tool">
          <div class="icon">🧆</div>
          فلافل
        </div>

        <div class="tool">
          <div class="icon">🥣</div>
          طحينة
        </div>

        <div class="tool">
          <div class="icon">🍆</div>
          مسقعة
        </div>

        <div class="tool">
          <div class="icon">🥚</div>
          بيض
        </div>
      </div>

      <div class="upgrades">
        <h3>⚙️ التطويرات</h3>

        <button class="upgrade" onclick="upgrade('capacity')">
          🥘 زيادة المخزون
          <br>
          <span id="capacityText">30 جنيه</span>
        </button>

        <button class="upgrade" onclick="upgrade('speed')">
          ⚡ سرعة المطبخ
          <br>
          <span id="speedText">40 جنيه</span>
        </button>

        <button class="upgrade" onclick="upgrade('service')">
          👨‍🍳 سرعة الخدمة
          <br>
          <span id="serviceText">50 جنيه</span>
        </button>
      </div>

    </div>

  </div>
</div>

<script>
const foods={
  foul:{name:"فول",price:5},
  falafel:{name:"فلافل",price:5},
  baba:{name:"بابا غنوج",price:5},
  tahina:{name:"طحينة",price:5},
  foulMix:{name:"فول خلطة",price:5},
  mesaka:{name:"مسقعة",price:5},
  eggplant:{name:"باذنجان",price:5},
  egg:{name:"بيض",price:5},
  potato:{name:"بطاطس",price:5},
  fino:{name:"عيش فينو",price:5},
  shamy:{name:"عيش شامي",price:5}
};

let money=Number(localStorage.getItem("money"))||50;
let rating=Number(localStorage.getItem("rating"))||5;
let served=Number(localStorage.getItem("served"))||0;
let level=Number(localStorage.getItem("level"))||1;

let capacityLevel=Number(localStorage.getItem("capacityLevel"))||1;
let speedLevel=Number(localStorage.getItem("speedLevel"))||1;
let serviceLevel=Number(localStorage.getItem("serviceLevel"))||1;

let customers=[];
let nextId=1;

const bulkFoods=[
  "foul",
  "falafel",
  "baba",
  "tahina",
  "foulMix",
  "mesaka",
  "eggplant",
  "egg",
  "potato",
  "fino",
  "shamy"
];

const sandwichFoods=[
  "foul",
  "falafel",
  "foulMix",
  "mesaka",
  "eggplant",
  "egg",
  "potato"
];

function save(){
  localStorage.setItem("money",money);
  localStorage.setItem("rating",rating);
  localStorage.setItem("served",served);
  localStorage.setItem("level",level);
  localStorage.setItem("capacityLevel",capacityLevel);
  localStorage.setItem("speedLevel",speedLevel);
  localStorage.setItem("serviceLevel",serviceLevel);
}

function updateStats(){
  document.getElementById("money").textContent=money;
  document.getElementById("rating").textContent=rating;
  document.getElementById("served").textContent=served;
  document.getElementById("level").textContent=level;

  document.getElementById("capacityText").textContent=
    (30*capacityLevel)+" جنيه";

  document.getElementById("speedText").textContent=
    (40*speedLevel)+" جنيه";

  document.getElementById("serviceText").textContent=
    (50*serviceLevel)+" جنيه";
}

/* إنشاء طلب */

function createCustomer(){

  if(customers.length>=3) return;

  const isBulk=Math.random()<.48;

  let key;
  let moneyAmount;
  let count;

  if(isBulk){

    key=bulkFoods[Math.floor(Math.random()*bulkFoods.length)];

    moneyAmount=(Math.floor(Math.random()*3)+1)*5;

    if(key==="foul"){
      count=moneyAmount===5?2:moneyAmount===10?4:6;
    }
    else if(key==="falafel"){
      count=moneyAmount/5*4;
    }
    else{
      count=moneyAmount/5;
    }

  }else{

    key=sandwichFoods[
      Math.floor(Math.random()*sandwichFoods.length)
    ];

    count=Math.floor(Math.random()*3)+1;
  }

  customers.push({
    id:nextId++,
    type:isBulk?"bulk":"sandwich",
    key:key,
    money:moneyAmount,
    count:count,
    servedCount:0
  });

  renderCustomers();
}

/* عرض الزباين */

function renderCustomers(){

  const box=document.getElementById("customers");
  box.innerHTML="";

  customers.forEach(c=>{

    const div=document.createElement("div");
    div.className="customer";
    div.id="customer-"+c.id;

    let orderText="";

    if(c.type==="bulk"){

      if(c.key==="foul"){
        orderText=`عايز بـ${c.money} فول<br>🥄 ${c.count} مغارف`;
      }
      else if(c.key==="falafel"){
        orderText=`عايز بـ${c.money} فلافل<br>🧆 ${c.count} فلافليات`;
      }
      else{
        orderText=`عايز بـ${c.money} ${foods[c.key].name}`;
      }

    }else{

      orderText=`عايز ${c.count} سندوتش<br>${foods[c.key].name}`;
    }

    div.innerHTML=`
      <div class="person">
        <div class="head"></div>
        <div class="body"></div>
      </div>

      <div class="order">${orderText}</div>

      <button onclick="deliver(${c.id})">
        تسليم الطلب
      </button>
    `;

    box.appendChild(div);
  });
}

/* العميل الحالي */

function currentCustomer(){

  if(customers.length===0){
    toast("مفيش زبون دلوقتي");
    return null;
  }

  return customers[0];
}

/* السايب */

function bulkFood(key){

  const c=currentCustomer();
  if(!c) return;

  if(c.type!=="bulk" || c.key!==key){
    toast("ده مش طلب الزبون!");
    return;
  }

  if(key==="foul"){
    scoopEffect("🥄");
    c.servedCount++;

    toast(`مغرفة فول ${c.servedCount}/${c.count}`);
  }
  else if(key==="falafel"){
    toast("الفلافل السايبة استخدم القرطاس 🛍️");
    return;
  }
  else{
    c.servedCount=c.count;
    scoopEffect("🥣");
    toast("اتجهز");
  }

  renderCustomers();
}

/* قرطاس الفلافل */

let bagCustomerId=null;
let bagCount=0;

function useBag(){

  const c=currentCustomer();
  if(!c) return;

  if(c.type!=="bulk" || c.key!=="falafel"){
    toast("القرطاس للفلافل السايبة فقط");
    return;
  }

  if(bagCustomerId!==c.id){
    bagCustomerId=c.id;
    bagCount=0;
  }

  if(bagCount>=c.count){
    toast("القرطاس اكتمل!");
    return;
  }

  bagCount++;
  c.servedCount=bagCount;

  document.getElementById("bagCount").textContent=bagCount;

  document.getElementById("bagButton")
    .classList.add("bulk-active");

  scoopEffect("🧆");

  toast(`${bagCount} / ${c.count}`);

  if(bagCount===c.count){
    setTimeout(()=>{
      toast("القرطاس جاهز للتسليم ✅");
    },150);
  }

  renderCustomers();
}

/* الساندوتشات */

function sandwich(key){

  const c=currentCustomer();
  if(!c) return;

  if(c.type!=="sandwich" || c.key!==key){
    toast("ده مش طلب الزبون!");
    return;
  }

  if(c.servedCount>=c.count){
    toast("الطلب اكتمل");
    return;
  }

  c.servedCount++;

  scoopEffect("🥙");

  toast(
    `سندوتش ${c.servedCount}/${c.count}`
  );

  renderCustomers();
}

/* تسليم */

function deliver(id){

  const c=customers.find(x=>x.id===id);

  if(!c) return;

  if(c.servedCount<c.count){
    toast("الطلب لسه ناقص ❌");
    return;
  }

  const el=document.getElementById("customer-"+id);

  if(el){
    el.classList.add("done");
  }

  money+=c.money;
  served++;

  if(served%10===0){
    level++;
    toast("🎉 وصلت لفل جديد!");
  }else{
    toast("✅ الطلب اتسلّم!");
  }

  customers=customers.filter(x=>x.id!==id);

  bagCustomerId=null;
  bagCount=0;

  document.getElementById("bagCount").textContent="0";
  document.getElementById("bagButton")
    .classList.remove("bulk-active");

  save();
  updateStats();

  setTimeout(renderCustomers,350);
}

/* المؤثر */

function scoopEffect(symbol){

  const e=document.createElement("div");
  e.className="scoop";
  e.textContent=symbol;

  e.style.left=(40+Math.random()*20)+"%";
  e.style.top="55%";

  document.body.appendChild(e);

  setTimeout(()=>e.remove(),600);
}

/* تطويرات */

function upgrade(type){

  let cost;

  if(type==="capacity"){
    cost=30*capacityLevel;

    if(money<cost){
      toast("الفلوس مش كفاية 💰");
      return;
    }

    money-=cost;
    capacityLevel++;
    toast("🥘 المخزون اتطور!");
  }

  if(type==="speed"){
    cost=40*speedLevel;

    if(money<cost){
      toast("الفلوس مش كفاية 💰");
      return;
    }

    money-=cost;
    speedLevel++;
    toast("⚡ المطبخ بقى أسرع!");
  }

  if(type==="service"){
    cost=50*serviceLevel;

    if(money<cost){
      toast("الفلوس مش كفاية 💰");
      return;
    }

    money-=cost;
    serviceLevel++;
    toast("👨‍🍳 الخدمة بقت أسرع!");
  }

  save();
  updateStats();
}

/* رسالة */

function toast(text){

  const old=document.querySelector(".toast");
  if(old) old.remove();

  const t=document.createElement("div");
  t.className="toast";
  t.textContent=text;

  document.body.appendChild(t);

  setTimeout(()=>t.remove(),900);
}

/* تشغيل اللعبة */

updateStats();

for(let i=0;i<3;i++){
  setTimeout(createCustomer,i*250);
}

setInterval(()=>{
  createCustomer();
},3500);

/* حفظ تلقائي */
setInterval(save,5000);
</script>
